name: Bump Cask

on:
  repository_dispatch:
    types: [bump-cask]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Cask formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
          URL: ${{ github.event.client_payload.url }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          CASK_FILE="Casks/vapor.rb"

          # VERSION arrives as "1.0.7-7" (marketing-build, tag without v)
          # Cask version uses comma format: "1.0.7,7"
          MARKETING_VERSION="${VERSION%-*}"
          BUILD_VERSION="${VERSION##*-}"
          if [ "$MARKETING_VERSION" = "$VERSION" ]; then
            BUILD_VERSION="1"
          fi
          CASK_VERSION="${MARKETING_VERSION},${BUILD_VERSION}"

          echo "Bumping cask to version $CASK_VERSION"
          echo "  URL:    $URL"
          echo "  SHA256: $SHA256"

          # Targeted replacement of version, sha256, and url lines
          sed -i "s|^  version \".*\"|  version \"${CASK_VERSION}\"|" "$CASK_FILE"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" "$CASK_FILE"
          sed -i "s|^  url \".*\",|  url \"${URL}\",|" "$CASK_FILE"

          echo "--- Updated cask ---"
          cat "$CASK_FILE"

          # Validate Ruby syntax
          ruby -c "$CASK_FILE"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          BRANCH="bump-${TAG}"
          git checkout -b "$BRANCH"
          git add Casks/vapor.rb
          git commit -m "Bump vapor to ${{ github.event.client_payload.tag }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Bump vapor to ${{ github.event.client_payload.tag }}" \
            --body "Automated cask bump triggered by [Vapor release ${{ github.event.client_payload.tag }}](https://github.com/memetic-research-labs/vapor/releases/tag/${{ github.event.client_payload.tag }})." \
            --label "auto-bump" || true
